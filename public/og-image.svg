  <g font-family="'Courier New', monospace" font-size="13" xml:space="preserve">
    <text x="575" y="100"><tspan fill="#c678dd">import</tspan> <tspan fill="#abb2bf">{</tspan> <tspan fill="#9cdcfe">db</tspan> <tspan fill="#abb2bf">}</tspan> <tspan fill="#c678dd">from</tspan> <tspan fill="#98c379">"@/lib/firebase"</tspan><tspan fill="#abb2bf">;</tspan></text>
    <text x="575" y="118"><tspan fill="#c678dd">import</tspan> <tspan fill="#abb2bf">{</tspan> <tspan fill="#dcdcaa">addDoc</tspan><tspan fill="#abb2bf">,</tspan> <tspan fill="#dcdcaa">collection</tspan> <tspan fill="#abb2bf">}</tspan> <tspan fill="#c678dd">from</tspan> <tspan fill="#98c379">"firebase/firestore"</tspan><tspan fill="#abb2bf">;</tspan></text>
    <text x="575" y="136"><tspan fill="#c678dd">import</tspan> <tspan fill="#abb2bf">{</tspan> <tspan fill="#4ec9b0">NextResponse</tspan> <tspan fill="#abb2bf">}</tspan> <tspan fill="#c678dd">from</tspan> <tspan fill="#98c379">"next/server"</tspan><tspan fill="#abb2bf">;</tspan></text>
    <text x="575" y="154"><tspan fill="#c678dd">import</tspan> <tspan fill="#569cd6">type</tspan> <tspan fill="#abb2bf">{</tspan> <tspan fill="#4ec9b0">Snippet</tspan> <tspan fill="#abb2bf">}</tspan> <tspan fill="#c678dd">from</tspan> <tspan fill="#98c379">"@/types"</tspan><tspan fill="#abb2bf">;</tspan></text>

    <text x="575" y="190"><tspan fill="#c678dd">export</tspan> <tspan fill="#569cd6">async function</tspan> <tspan fill="#dcdcaa">POST</tspan><tspan fill="#abb2bf">(</tspan><tspan fill="#9cdcfe">req</tspan><tspan fill="#abb2bf">:</tspan> <tspan fill="#4ec9b0">Request</tspan><tspan fill="#abb2bf">) {</tspan></text>
    <text x="575" y="208"><tspan fill="#abb2bf">  </tspan><tspan fill="#c678dd">try</tspan> <tspan fill="#abb2bf">{</tspan></text>
    <text x="575" y="226"><tspan fill="#abb2bf">    </tspan><tspan fill="#569cd6">const</tspan> <tspan fill="#9cdcfe">payload</tspan> <tspan fill="#abb2bf">=</tspan> <tspan fill="#c678dd">await</tspan> <tspan fill="#9cdcfe">req</tspan><tspan fill="#abb2bf">.</tspan><tspan fill="#dcdcaa">json</tspan><tspan fill="#abb2bf">();</tspan></text>
    <text x="575" y="244"><tspan fill="#abb2bf">    </tspan><tspan fill="#569cd6">const</tspan> <tspan fill="#abb2bf">{</tspan> <tspan fill="#9cdcfe">title</tspan><tspan fill="#abb2bf">,</tspan> <tspan fill="#9cdcfe">code</tspan><tspan fill="#abb2bf">,</tspan> <tspan fill="#9cdcfe">lang</tspan> <tspan fill="#abb2bf">}</tspan> <tspan fill="#abb2bf">=</tspan> <tspan fill="#9cdcfe">payload</tspan> <tspan fill="#569cd6">as</tspan> <tspan fill="#4ec9b0">Snippet</tspan><tspan fill="#abb2bf">;</tspan></text>

    <text x="575" y="280"><tspan fill="#abb2bf">    </tspan><tspan fill="#c678dd">if</tspan> <tspan fill="#abb2bf">(!</tspan><tspan fill="#9cdcfe">code</tspan> <tspan fill="#abb2bf">||</tspan> <tspan fill="#abb2bf">!</tspan><tspan fill="#9cdcfe">lang</tspan><tspan fill="#abb2bf">) {</tspan></text>
    <text x="575" y="298"><tspan fill="#abb2bf">      </tspan><tspan fill="#c678dd">return</tspan> <tspan fill="#4ec9b0">NextResponse</tspan><tspan fill="#abb2bf">.</tspan><tspan fill="#dcdcaa">json</tspan><tspan fill="#abb2bf">(</tspan></text>
    <text x="575" y="316"><tspan fill="#abb2bf">        {</tspan> <tspan fill="#9cdcfe">error</tspan><tspan fill="#abb2bf">:</tspan> <tspan fill="#98c379">"Code and language are required fields."</tspan> <tspan fill="#abb2bf">},</tspan></text>
    <text x="575" y="334"><tspan fill="#abb2bf">        {</tspan> <tspan fill="#9cdcfe">status</tspan><tspan fill="#abb2bf">:</tspan> <tspan fill="#d19a66">400</tspan> <tspan fill="#abb2bf">}</tspan></text>
    <text x="575" y="352"><tspan fill="#abb2bf">      );</tspan></text>
    <text x="575" y="370"><tspan fill="#abb2bf">    }</tspan></text>

    <text x="575" y="406"><tspan fill="#abb2bf">    </tspan><tspan fill="#569cd6">const</tspan> <tspan fill="#9cdcfe">snippetRef</tspan> <tspan fill="#abb2bf">=</tspan> <tspan fill="#c678dd">await</tspan> <tspan fill="#dcdcaa">addDoc</tspan><tspan fill="#abb2bf">(</tspan><tspan fill="#dcdcaa">collection</tspan><tspan fill="#abb2bf">(</tspan><tspan fill="#9cdcfe">db</tspan><tspan fill="#abb2bf">,</tspan> <tspan fill="#98c379">"snippets"</tspan><tspan fill="#abb2bf">), {</tspan></text>
    <text x="575" y="424"><tspan fill="#abb2bf">      </tspan><tspan fill="#9cdcfe">title</tspan><tspan fill="#abb2bf">:</tspan> <tspan fill="#9cdcfe">title</tspan> <tspan fill="#abb2bf">||</tspan> <tspan fill="#98c379">"Untitled Snippet"</tspan><tspan fill="#abb2bf">,</tspan></text>
    <text x="575" y="442"><tspan fill="#abb2bf">      </tspan><tspan fill="#9cdcfe">code</tspan><tspan fill="#abb2bf">,</tspan></text>
    <text x="575" y="460"><tspan fill="#abb2bf">      </tspan><tspan fill="#9cdcfe">lang</tspan><tspan fill="#abb2bf">,</tspan></text>
    <text x="575" y="478"><tspan fill="#abb2bf">      </tspan><tspan fill="#9cdcfe">author</tspan><tspan fill="#abb2bf">:</tspan> <tspan fill="#98c379">"nimzztes@gmail.com"</tspan><tspan fill="#abb2bf">,</tspan></text>
    <text x="575" y="496"><tspan fill="#abb2bf">      </tspan><tspan fill="#9cdcfe">createdAt</tspan><tspan fill="#abb2bf">:</tspan> <tspan fill="#569cd6">new</tspan> <tspan fill="#4ec9b0">Date</tspan><tspan fill="#abb2bf">().</tspan><tspan fill="#dcdcaa">toISOString</tspan><tspan fill="#abb2bf">(),</tspan></text>
    <text x="575" y="514"><tspan fill="#abb2bf">      </tspan><tspan fill="#9cdcfe">likes</tspan><tspan fill="#abb2bf">:</tspan> <tspan fill="#d19a66">0</tspan></text>
    <text x="575" y="532"><tspan fill="#abb2bf">    });</tspan></text>

    <text x="575" y="568"><tspan fill="#abb2bf">    </tspan><tspan fill="#c678dd">return</tspan> <tspan fill="#4ec9b0">NextResponse</tspan><tspan fill="#abb2bf">.</tspan><tspan fill="#dcdcaa">json</tspan><tspan fill="#abb2bf">({</tspan> <tspan fill="#9cdcfe">id</tspan><tspan fill="#abb2bf">:</tspan> <tspan fill="#9cdcfe">snippetRef</tspan><tspan fill="#abb2bf">.</tspan><tspan fill="#9cdcfe">id</tspan><tspan fill="#abb2bf">,</tspan> <tspan fill="#9cdcfe">success</tspan><tspan fill="#abb2bf">:</tspan> <tspan fill="#569cd6">true</tspan> <tspan fill="#abb2bf">});</tspan></text>
